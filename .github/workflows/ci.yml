name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - name: Enable user namespaces on ephemeral runner
        id: userns
        run: |
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -r "$restriction" ]; then
            original=$(cat "$restriction")
            echo "apparmor_userns=$original" >> "$GITHUB_OUTPUT"
            if [ "$original" = 1 ]; then
              if sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
              else
                echo "::warning::Could not enable user namespaces; sandbox tests will be explicitly skipped if unavailable"
              fi
            fi
          fi
          if ! unshare --user --map-root-user --mount --net --pid --ipc --uts --fork --kill-child=KILL --propagation private true; then
            echo "::warning::Runner does not permit required namespaces; sandbox-dependent tests will report as skipped"
          fi
      - run: python -m compileall -q agent research utils tests
      - run: python -m pytest -q -rs
        env:
          PYTHONPATH: .
      - name: Restore runner AppArmor setting
        if: always() && steps.userns.outputs.changed == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=${{ steps.userns.outputs.apparmor_userns }}
