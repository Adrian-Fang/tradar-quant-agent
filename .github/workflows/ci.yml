name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify experiment sandbox namespaces
        run: |
          if ! command -v unshare >/dev/null; then
            echo "::error::unshare is required to run the experiment sandbox tests"
            exit 1
          fi
          if ! unshare --user --map-root-user --mount --net --pid --ipc --uts --fork --kill-child=KILL --propagation private true; then
            echo "::error::Runner does not permit the Linux namespaces required by the experiment sandbox tests"
            exit 1
          fi
      - run: python -m compileall -q agent research utils tests
      - run: python -m pytest -q
        env:
          PYTHONPATH: .
